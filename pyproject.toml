[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-alpha"
version = "1.1.0"
description = "Information-theoretic symbolic alpha mining for China A-shares"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<4",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "pyarrow>=12,<25",
    "matplotlib>=3.7,<4",
    "baostock>=0.8.9",
    "lightgbm>=3.3.5,<=4.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["cluster_upload*", "experiments", "data", ".git", "__pycache__"]
addopts = "-ra"
